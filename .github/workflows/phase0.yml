name: Phase 0 — Product Research + Script

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Phase 0 — product research
        env:
          GEMINI_API_KEY:         ${{ secrets.GEMINI_API_KEY }}
          GSHEET_CREDENTIALS_B64: ${{ secrets.GSHEET_CREDENTIALS_B64 }}
          GSHEET_SPREADSHEET_ID:  ${{ secrets.GSHEET_SPREADSHEET_ID }}
          PLUSBASE_STORE_URL:     ${{ secrets.PLUSBASE_STORE_URL }}
        run: python main.py

      - name: Run Phase 2+4 — script generation
        env:
          GEMINI_API_KEY:         ${{ secrets.GEMINI_API_KEY }}
          GSHEET_CREDENTIALS_B64: ${{ secrets.GSHEET_CREDENTIALS_B64 }}
          GSHEET_SPREADSHEET_ID:  ${{ secrets.GSHEET_SPREADSHEET_ID }}
        run: python main_content.py

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-log-${{ github.run_id }}
          path: |
            phase0_*.log
            shortlist_fallback_*.csv
            data/*.json
          retention-days: 7
