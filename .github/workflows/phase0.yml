name: Phase 0 — Product Research

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install system dependencies (ImageMagick)
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick
          # Fix ImageMagick policy to allow text generation for moviepy
          sudo sed -i 's/<policy domain="path" rights="none" pattern="@\*"/<!-- <policy domain="path" rights="none" pattern="@\*" -->/g' /etc/ImageMagick-6/policy.xml

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run Phase 0 research pipeline
        env:
          GEMINI_API_KEY:         ${{ secrets.GEMINI_API_KEY }}
          GSHEET_CREDENTIALS_B64: ${{ secrets.GSHEET_CREDENTIALS_B64 }}
          GSHEET_SPREADSHEET_ID:  ${{ secrets.GSHEET_SPREADSHEET_ID }}
          PLUSBASE_STORE_URL:     ${{ secrets.PLUSBASE_STORE_URL }}
        run: python main.py

      - name: Run Phase 1-4 Content Creation Pipeline
        env:
          GEMINI_API_KEY:         ${{ secrets.GEMINI_API_KEY }}
          GSHEET_CREDENTIALS_B64: ${{ secrets.GSHEET_CREDENTIALS_B64 }}
          GSHEET_SPREADSHEET_ID:  ${{ secrets.GSHEET_SPREADSHEET_ID }}
          DRIVE_FOLDER_ID:        ${{ secrets.DRIVE_FOLDER_ID }}
        run: python main_content.py

      - name: Upload logs and videos as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-output-${{ github.run_id }}
          path: |
            phase0_*.log
            shortlist_fallback.csv
            output/*.mp4
            data/*.json
          retention-days: 14
